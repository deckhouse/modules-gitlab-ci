# Merge MR and Create Release — GitLab analogue of modules-actions merge-and-release.
#
# variables (optional):
#   MERGE_RELEASE_NOTES_PATH     - path to the sectioned release-notes directory
#                                 (default: .release-notes)
#   MERGE_RELEASE_CHANGELOG_PATH - path to the legacy CHANGELOG directory (default: CHANGELOG)
#   MERGE_RELEASE_BASE_BRANCH    - base branch to merge into (default: main)
#   RELEASE_TOKEN                - GitLab token with api, write_repository (for merge + push + release).
#                                 If not set, CI_JOB_TOKEN is used (may not have push/release in all setups).
#
# rules: job runs when MR has label "release" or "ready-for-release".
#
# IMPORTANT: GitLab does NOT start a pipeline when you add/remove a label. After adding
# the "release" (or "ready-for-release") label to the MR, you must run the pipeline
# manually: open the MR → Pipelines → "Run pipeline", or use the "Run pipeline" button.

.merge_and_release:
  stage: post
  image:
    name: debian:bookworm-slim
    entrypoint: [""]
  variables:
    MERGE_RELEASE_NOTES_PATH: ".release-notes"
    MERGE_RELEASE_CHANGELOG_PATH: "CHANGELOG"
    MERGE_RELEASE_BASE_BRANCH: "main"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)release(,|$)/
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /(^|,)ready-for-release(,|$)/
      when: on_success
    - when: never
  before_script:
    - |
      set -e
      missing=""
      for bin in git curl jq; do
        command -v "$bin" >/dev/null 2>&1 || missing="$missing $bin"
      done
      if [ -n "$missing" ]; then
        if [ "$(id -u)" = "0" ]; then
          apt-get update -qq && apt-get install -y -qq $missing
        else
          echo "Missing required tools:$missing. Install them on the runner host (shell executor has no root)." >&2
          exit 1
        fi
      fi
  script:
    - |
      set -euo pipefail
      REPO_DIR=$(mktemp -d)
      trap 'rm -rf "$REPO_DIR"' EXIT
      PR_TITLE="$CI_MERGE_REQUEST_TITLE"
      VERSION=$(echo "$PR_TITLE" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1)
      [ -n "$VERSION" ] || { echo "Error: Could not extract version from MR title: $PR_TITLE"; exit 1; }
      [[ "$VERSION" =~ ^v ]] || VERSION="v${VERSION}"
      echo "Extracted version: $VERSION"
      # Merge MR (merge commit, delete source branch). `squash=false` is passed
      # explicitly: with the parameter omitted GitLab falls back to the MR's own squash
      # flag, which a project configured to squash by default sets for every MR, so the
      # release commit would be collapsed anyway. A project whose "Squash commits when
      # merging" setting is "Require" rejects the call -- relax the setting there, the
      # history of a release branch is meant to survive the merge.
      curl -s --request PUT \
        --header "PRIVATE-TOKEN: ${RELEASE_TOKEN:-$CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/merge?squash=false&should_remove_source_branch=true" \
        | jq -e .id >/dev/null || { echo "Merge failed"; exit 1; }
      echo "MR merged successfully."
      sleep 10
      # Clone base branch (post-merge), tag, push
      REPO_URL="https://oauth2:${RELEASE_TOKEN:-$CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git clone --branch "${MERGE_RELEASE_BASE_BRANCH}" --single-branch --depth 50 "$REPO_URL" "$REPO_DIR"
      cd "$REPO_DIR"
      # Use local (repo-scoped) git config to avoid writing to $HOME on shell executors.
      git config user.email "gitlab-ci@gitlab.com"
      git config user.name "GitLab CI"
      git fetch origin "${MERGE_RELEASE_BASE_BRANCH}"
      git reset --hard "origin/${MERGE_RELEASE_BASE_BRANCH}"
      if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
        git tag -a "$VERSION" -m "Release $VERSION"
        git push origin "$VERSION"
        echo "Tag $VERSION created and pushed."
      else
        echo "Tag $VERSION already exists, skipping tag creation."
      fi
      # Read the release notes from the clone (merged state). A module on the sectioned
      # format keeps them in `.release-notes/<version>.yaml`; one still on the flat format
      # keeps them in `CHANGELOG/<version>.yml`. Both are looked up, newest layout first,
      # so a module can migrate without a change here.
      NOTES_FILE="$REPO_DIR/${MERGE_RELEASE_NOTES_PATH}/${VERSION}.yaml"
      CHANGELOG_FILE="$REPO_DIR/${MERGE_RELEASE_CHANGELOG_PATH}/${VERSION}.yml"
      DESC_FILE="$REPO_DIR/release_description.md"
      if [ -f "$NOTES_FILE" ]; then
        printf "## Release notes\n\n\`\`\`yaml\n%s\n\`\`\`\n" "$(cat "$NOTES_FILE")" > "$DESC_FILE"
      elif [ -f "$CHANGELOG_FILE" ]; then
        printf "## Changelog\n\n\`\`\`yaml\n%s\n\`\`\`\n" "$(cat "$CHANGELOG_FILE")" > "$DESC_FILE"
      else
        echo "Release $VERSION" > "$DESC_FILE"
        echo "Warning: neither $NOTES_FILE nor $CHANGELOG_FILE found, using default description."
      fi
      # Create GitLab Release
      jq -n --arg tag_name "$VERSION" --arg name "$VERSION" --rawfile description "$DESC_FILE" \
        '{ tag_name: $tag_name, name: $name, description: $description }' \
        | curl -s --request POST \
          --header "PRIVATE-TOKEN: ${RELEASE_TOKEN:-$CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data @- \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
          | jq -e .tag_name >/dev/null || { echo "Create release failed"; exit 1; }
      echo "GitLab Release created for $VERSION."
