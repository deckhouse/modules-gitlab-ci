# Go checks: linter, tests, test coverage, modules check.
#
# Hidden jobs to be extended by consuming projects.
# Each job expects:
#   - GO_BUILD_TAGS variable (space-separated list of build tags / editions)
#   - `go` available in $PATH
#
# Optional variables:
#   GO_TESTS_EXCLUDE_REGEX     (.go_tests) skips test FILES whose path matches
#   GO_COVERAGE_EXCLUDE_REGEX  (.go_test_coverage) skips PACKAGES whose import path
#                              matches -- for cluster-dependent suites that share a
#                              module with the libraries they exercise
#
# Example usage in a project:
#
#   include:
#     - project: "deckhouse/3p/deckhouse/modules-gitlab-ci"
#       ref: "v13.0"
#       file:
#         - "/templates/Go_Checks.gitlab-ci.yml"
#
#   go_linter_dev:
#     extends:
#       - .go_linter
#       - .dev

# ---------------------------------------------------------------------------
# Linter
# ---------------------------------------------------------------------------
.go_linter:
  stage: go_checks
  allow_failure: true
  script:
    - |
      unique_index=0
      section_start() {
        local section_title="${1}"
        local section_description="${2}"
        if [ "$GITLAB_CI" == "true" ]; then
          unique_index=$((unique_index + 1))
          echo -e "section_start:$(date +%s):${section_title}_${unique_index}[collapsed=true]\r\e[0K${section_description}"
        else
          echo "$section_description"
        fi
      }
      section_end() {
        local section_title="${1}"
        if [ "$GITLAB_CI" == "true" ]; then
          echo -e "section_end:$(date +%s):${section_title}_${unique_index}\r\e[0K"
        fi
      }

      # golangci-lint refuses a target newer than the Go it was built with
      # ("the Go language version (go1.26) used to build golangci-lint is lower
      # than the targeted Go version (1.27.0)"), so this pin has to keep up with
      # the modules: base-images v2.1.7 moved them to go 1.27.0 and every
      # go_linter job in the fleet has been failing since. v2.13.2 is built with
      # go1.27.0.
      linter_version="v2.13.2"
      section_start "install_linter" "Installing golangci-lint@$linter_version"
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b . $linter_version
      section_end "install_linter"

      for config in .golangci.yaml .golangci.yml; do
        if [ -f "$config" ] && ! grep -q 'version:.*"2"' "$config" 2>/dev/null; then
          echo "Migrating $config to golangci-lint v2 format..."
          ./golangci-lint migrate -c "$config" --skip-validation 2>/dev/null || true
        fi
      done

      basedir=$(pwd)
      failed='false'

      # go_module_roots prints the directories that may hold Go modules, skipping
      # the ones this repository does not have.
      #
      # images/ holds the buildable components. lib/go and e2e hold,
      # respectively, the packages those components share and the end-to-end
      # suite; both are Go modules in their own right, both are covered by the
      # repository's .golangci config, and neither was ever linted.
      go_module_roots() {
        local root
        for root in images lib/go e2e; do
          if [ -d "$basedir/$root" ]; then
            printf '%s\n' "$root"
          fi
        done
      }

      run_linters() {
        local run_for="${1}"
        local extra_args="${2}"
        local roots
        roots=$(go_module_roots)
        if [ -z "$roots" ]; then
          echo "Nothing to lint: this repository has no images, lib/go or e2e directory"
          return
        fi
        # Directories whose name starts with . or _ are invisible to the go
        # tool, and a reused runner workspace leaves whole checkouts of other
        # repositories in some of them (e2e/_storage-e2e is one), so the go.mod
        # files under them are not ours to lint.
        for i in $(find $roots \( -name '.*' -o -name '_*' \) -prune -o -type f -name go.mod -print); do
          dir=$(echo $i | sed 's/go.mod$//')
          cd $basedir/$dir
          for edition in $GO_BUILD_TAGS; do
            section_start "run_lint" "Running linter in $dir (edition: $edition) for $run_for"
            # Absolute path: the modules sit at different depths (images/x/,
            # lib/go/x/, e2e/), so a relative one cannot reach the binary.
            "$basedir/golangci-lint" run ${extra_args} --fix --color=always --allow-parallel-runners --build-tags $edition
            local linter_status=$?
            section_end "run_lint"
            if [ $linter_status -ne 0 ]; then
              echo -e "\e[31mLinter FAILED in $dir (edition: $edition) for $run_for\e[0m"
              failed='true'
            else
              echo -e "\e[32mLinter PASSED in $dir (edition: $edition) for $run_for\e[0m"
            fi
          done
          cd - > /dev/null
        done

        if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
          echo -e "\e[31mLinter requests changes for $run_for\e[0m"
          section_start "print_patch" "To apply these changes run"
          echo "git apply - <<EOF
      $(git diff)
      EOF"
          section_end "print_patch"
          git checkout -f
          failed='true'
        else
          echo -e "\e[32mLinter doesn't have changes requested for $run_for\e[0m"
        fi
      }

      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA}" ]; then
        run_linters "modified files" "--new-from-merge-base=${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      fi

      run_linters "all files"

      rm golangci-lint

      if [ $failed == 'true' ]; then
        exit 1
      fi

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
.go_tests:
  stage: go_checks
  allow_failure: true
  script:
    - |
      basedir=$(pwd)
      failed='false'

      # Force the toolchain selected by go.mod to be downloaded; see the long
      # comment in `.go_test_coverage` below. Even without `-cover`, anything
      # that ends up calling stripped tools (e.g. `addr2line`, `pprof`,
      # `test2json`) will break against the longsleep PPA Go on the runner,
      # so we keep behaviour consistent with the coverage job.
      export GOTOOLCHAIN=auto

      mod_go_toolchain() {
        local gomod="$1"
        local v
        v=$(awk '$1 == "go" && $2 ~ /^[0-9]+\.[0-9]+(\.[0-9]+)?$/ {print $2; exit}' "$gomod")
        if [ -z "$v" ]; then
          return
        fi
        case "$v" in
          *.*.*) ;;
          *) v="${v}.0" ;;
        esac
        printf 'go%s\n' "$v"
      }

      # Find the nearest go.mod walking up from $1. Prints its path or empty.
      find_gomod_for() {
        local d="$1"
        while [ -n "$d" ] && [ "$d" != "/" ] && [ "$d" != "." ]; do
          if [ -f "$d/go.mod" ]; then
            printf '%s\n' "$d/go.mod"
            return
          fi
          d=$(dirname "$d")
        done
      }

      # GO_TESTS_EXCLUDE_REGEX (optional, ERE) skips test files whose path
      # matches it. Needed by modules that carry Go sources for a *patched
      # upstream* tree: those files belong to the upstream module and only
      # compile after the patches are applied during the image build, so there
      # is no go.mod to find here and `go test` in place always fails. Such
      # modules run those tests in the build stage instead, where the tree is
      # assembled. Without the skip a single such file turns this job red for
      # every edition in GO_BUILD_TAGS and hides the tests that do run.
      for i in $(find images -type f -name '*_test.go'); do
        if [ -n "${GO_TESTS_EXCLUDE_REGEX:-}" ] && echo "$i" | grep -qE "$GO_TESTS_EXCLUDE_REGEX"; then
          echo "Skipping $i (GO_TESTS_EXCLUDE_REGEX=$GO_TESTS_EXCLUDE_REGEX)"
          continue
        fi
        dir=$(echo $i | sed 's/[a-z_A-Z0-9-]*_test.go$//')
        cd $basedir/$dir

        gomod=$(find_gomod_for "$basedir/$dir")
        if [ -n "$gomod" ]; then
          toolchain=$(mod_go_toolchain "$gomod")
          if [ -n "$toolchain" ]; then
            export GOTOOLCHAIN="$toolchain"
          else
            export GOTOOLCHAIN=auto
          fi
        else
          export GOTOOLCHAIN=auto
        fi

        for edition in $GO_BUILD_TAGS; do
          echo "Running tests in $dir (edition: $edition, GOTOOLCHAIN=$GOTOOLCHAIN)"
          go test -v -tags $edition
          if [ $? -ne 0 ]; then
            echo "Tests failed in $dir (edition: $edition)"
            failed='true'
          fi
        done
      done

      if [ $failed == 'true' ]; then
        exit 1
      fi

# ---------------------------------------------------------------------------
# Test coverage
# ---------------------------------------------------------------------------
.go_test_coverage:
  stage: go_checks
  allow_failure: true
  script:
    - |
      # Force the toolchain selected by `go.mod` to be downloaded for every
      # module we touch. The runner ships a Go distribution (longsleep PPA
      # on Ubuntu) that strips `covdata` and several other tools from
      # `$GOROOT/pkg/tool/...`. Plain `GOTOOLCHAIN=auto` keeps such a
      # stripped local toolchain whenever it satisfies the `go` directive,
      # and `go test ... -cover` then fails with `go: no such tool
      # "covdata"` for packages that have no `*_test.go` files. Setting
      # GOTOOLCHAIN=goX.Y.Z (without the `+auto` suffix) makes the `go`
      # command always fetch the official upstream toolchain, which
      # includes `covdata`. The downloaded archive is cached under
      # `$GOMODCACHE/golang.org/toolchain` and reused by subsequent jobs.
      export GOTOOLCHAIN=auto

      mod_go_toolchain() {
        local gomod="$1"
        local v
        v=$(awk '$1 == "go" && $2 ~ /^[0-9]+\.[0-9]+(\.[0-9]+)?$/ {print $2; exit}' "$gomod")
        if [ -z "$v" ]; then
          return
        fi
        case "$v" in
          *.*.*) ;;
          *) v="${v}.0" ;;
        esac
        printf 'go%s\n' "$v"
      }

      # A Deckhouse module keeps its Go modules under images/. A plain Go project --
      # a library, the e2e framework, a service consumed as a module -- has no
      # images/ directory at all, and used to fail here before running a single
      # test; fall back to every go.mod in the repository for those.
      if [ -d "images" ]; then
        gomod_root="images/"
      else
        gomod_root="."
        echo "No images/ directory; covering every go.mod in the repository instead."
      fi

      # GO_COVERAGE_EXCLUDE_REGEX (optional, ERE) drops packages whose import path
      # matches it. A plain Go project keeps its libraries and its cluster-dependent
      # suites in the same module, and those suites fail here by design: they want a
      # provisioned cluster and credentials, not `go test`. `.go_tests` never saw them
      # because it only walks images/, so this job is where they surface.
      find "$gomod_root" -type f -name "go.mod" -not -path "*/vendor/*" | while read -r gomod; do
        dir=$(dirname "$gomod")

        echo "Test coverage in $dir"

        cd "$dir" || continue

        toolchain=$(mod_go_toolchain go.mod)
        if [ -n "$toolchain" ]; then
          export GOTOOLCHAIN="$toolchain"
          echo "  Using GOTOOLCHAIN=$toolchain (forced download to get a complete Go SDK with 'covdata')"
        else
          export GOTOOLCHAIN=auto
          echo "  Could not parse 'go' directive from $dir/go.mod; falling back to GOTOOLCHAIN=auto"
        fi

        # Enumerate the packages instead of passing ./... so they can be filtered, and
        # so a module that holds no packages at all is skipped rather than failing the
        # job. A go.mod with no Go files is a normal thing to have -- it stands in for
        # upstream modules a `replace` points at -- and `go test ./...` there exits
        # non-zero with "matched no packages", which under `set -e` killed the whole job
        # before the modules that do have tests were ever reached.
        pkgs=$(go list ./... 2>/dev/null || true)
        if [ -n "${GO_COVERAGE_EXCLUDE_REGEX:-}" ] && [ -n "$pkgs" ]; then
          dropped=$(printf '%s\n' "$pkgs" | grep -E "$GO_COVERAGE_EXCLUDE_REGEX" || true)
          if [ -n "$dropped" ]; then
            echo "  Excluded by GO_COVERAGE_EXCLUDE_REGEX=$GO_COVERAGE_EXCLUDE_REGEX:"
            printf '    %s\n' $dropped
          fi
          pkgs=$(printf '%s\n' "$pkgs" | grep -vE "$GO_COVERAGE_EXCLUDE_REGEX" || true)
        fi
        if [ -z "$pkgs" ]; then
          echo "  No packages to cover here, skipping."
          cd - > /dev/null
          echo "----------------------------------------"
          continue
        fi

        for tag in $GO_BUILD_TAGS; do
          echo "  Build tag: $tag"
          go test $pkgs -cover -tags "$tag"
        done

        cd - > /dev/null

        echo "----------------------------------------"
      done

# ---------------------------------------------------------------------------
# Go modules check
# ---------------------------------------------------------------------------
.go_modules_check:
  stage: go_checks
  allow_failure: true
  script:
    - |
      search_dir=$(pwd)"/images"

      if [ ! -d "$search_dir" ]; then
        echo "Directory $search_dir does not exist."
        exit 1
      fi

      temp_dir=$(mktemp -d)
      touch "$temp_dir/incorrect_alert"

      trap 'rm -rf "$temp_dir"' EXIT

      find images/ -type f -name "go.mod" | while read -r gomod; do
        dir=$(dirname "$gomod")

        echo "Checking $dir"

        cd "$dir" || continue

        # The require paths of THIS go.mod, block form and single-line form alike.
        # `go list -m all` walks the whole module graph, but the finding this job
        # reports names a file -- "... in images/controller/go.mod" -- so it may only
        # judge what that file actually pins. Everything else is somebody else's
        # require, arriving through a dependency, and a consumer cannot fix it by
        # editing a version string:
        #
        #   github.com/deckhouse/deckhouse is a monorepo that `replace`s its own
        #   submodules, so a repository importing a single package from it inherits
        #   dhctl, go_lib/*, pkg/registry and friends -- several as the placeholder
        #   v0.0.0-00010101000000-000000000000, which has no real version to point at.
        #   Pinning them by hand needs explicit `require` lines for modules the
        #   repository does not import, and the next `go mod tidy` deletes them again.
        #
        # storage-foundation is the case in point: six such findings, all named against
        # images/controller/go.mod, none of them present in it.
        local_requires=$(awk '
          /^require[[:space:]]*\(/ { inblock = 1; next }
          inblock && /^\)/         { inblock = 0; next }
          inblock && NF >= 1       { print $1; next }
          /^require[[:space:]]+/   { print $2 }
        ' go.mod)

        # `-e` matters: a module graph containing replace-placeholder versions
        # (v0.0.0-00010101000000-000000000000, which `go mod tidy` writes for a module
        # resolved from the working tree) makes plain `go list -m all` exit non-zero
        # without printing anything, so the check died before comparing a single pin.
        # github.com/deckhouse/deckhouse carries several of those, which is why this hit
        # sds-replicated-volume and sds-unified-snapshots-poc. With -e the unresolvable
        # entries are reported and the rest is still listed.
        go list -m -e all | grep deckhouse | grep -v '=>' | while IFS= read -r line; do
          module_name=$(echo "$line" | awk '{print $1}')
          module_version=$(echo "$line" | awk '{print $2}')

          if [ -n "$module_version" ] && ! printf '%s\n' "$local_requires" | grep -qxF "$module_name"; then
            echo "  $module_name is not required by $dir/go.mod (reached through the module graph), skipping"
            continue
          fi

          if [ -z "$module_version" ]; then
            echo "  Checking module name $module_name"
            GITLAB_REPOSITORY=$(echo "$CI_REPOSITORY_URL" | sed 's/.*@//' | sed 's/\.git$//')
            correct_module_name="$GITLAB_REPOSITORY"/"$dir"
            if [ "$module_name" != "$correct_module_name" ]; then
              echo "  Incorrect module name: $module_name, expected: $correct_module_name"
              echo "  Incorrect module name: $module_name, expected: $correct_module_name" >> "$temp_dir/incorrect_alert"
            else
              echo "  Correct module name: $module_name"
            fi
          else
            echo "  Checking module tag $module_name"
            pseudo_tag=$(echo "$line" | awk '{print $2}')
            if [[ $pseudo_tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "  Exact tag for $module_name: $pseudo_tag, skipping"
              continue
            fi

            # Find the repository root of the dependency. On github.com the project
            # is the first three path segments, but a self-hosted GitLab can nest it
            # in groups -- fox.flant.com/deckhouse/storage/<project> is four -- so
            # try the longest candidate first and keep the one git can actually read.
            # Assuming three segments made the check clone the GROUP
            # (https://fox.flant.com/deckhouse/storage.git), and with `set -e` that
            # failed clone took the whole job down.
            segments=$(echo "$module_name" | awk -F'/' '{print NF}')
            repository=""
            # never block on a credential prompt while probing
            export GIT_TERMINAL_PROMPT=0
            for depth in 5 4 3; do
              [ "$segments" -ge "$depth" ] || continue
              candidate="https://$(echo "$module_name" | cut -d'/' -f1-$depth).git"
              if git ls-remote "$candidate" >/dev/null 2>&1; then
                repository="$candidate"
                break
              fi
            done

            if [ -z "$repository" ]; then
              echo "  Could not find a readable repository for $module_name, skipping"
              echo "  (a private repository needs a credential in this job: see the"
              echo "   GIT_CONFIG_COUNT / netrc setup a module can export before this)"
              continue
            fi

            # The module may live in a subdirectory of that repository, and only the
            # commits touching it move its pseudo-version. When the dependency IS
            # the repository root, keep the historical `api` pathspec: this check
            # exists to catch stale pins of our own api modules.
            module_subdir=$(echo "$module_name" | cut -d'/' -f$((depth + 1))-)
            if [ -z "$module_subdir" ] || [ "$module_subdir" = "$module_name" ]; then
              module_subdir="api"
            fi

            echo "  Cloning repo $repository into $temp_dir"
            if [ ! -d "$temp_dir/$repository" ]; then
              if ! git clone "$repository" "$temp_dir/$repository" >/dev/null 2>&1; then
                echo "  Could not clone $repository, skipping"
                continue
              fi
            fi

            cd "$temp_dir/$repository" || continue

            commit_info=$(git log -1 --pretty=format:"%H %cd" --date=iso-strict -- "$module_subdir")

            # Nothing in the repository matches the pathspec. For a dependency that
            # is the repository root that means it has no api/ directory, i.e. it is
            # not one of our api modules and this check has no opinion on its pin.
            # Without this guard the empty commit_info produced an empty hash and
            # `date -u -d ""` filled in today at 00:00:00, so the comparison always
            # failed and reported a bogus "actual: v0.0.0-<today>000000-" for
            # third-party dependencies such as deckhouse/lib-gossh and
            # deckhouse/rootca, which arrive through the module graph rather than
            # from a go.mod of ours.
            if [ -z "$commit_info" ]; then
              echo "  No commit touches $module_subdir in $repository, skipping"
              cd - >/dev/null 2>&1
              continue
            fi

            short_hash=$(echo "$commit_info" | awk '{print substr($1,1,12)}')
            commit_date=$(echo "$commit_info" | awk '{print $2}')
            commit_date=$(date -u -d "$commit_date" +"%Y%m%d%H%M%S")
            actual_pseudo_tag="v0.0.0-"$commit_date"-"$short_hash
            pseudo_tag_date=$(echo $pseudo_tag | awk -F'-' '{ print $2 }')
            echo "  Latest commit in $repository ($module_subdir): $short_hash $commit_date"

            if [[ "$pseudo_tag" != "$actual_pseudo_tag" ]]; then
              echo "  Incorrect pseudo tag for $module_name in $dir/go.mod (current: $pseudo_tag, actual: $actual_pseudo_tag)"
              echo "  Incorrect pseudo tag for $module_name in $dir/go.mod (current: $pseudo_tag, actual: $actual_pseudo_tag)" >> "$temp_dir/incorrect_alert"
            fi

            cd - >/dev/null 2>&1
          fi
        done

        cd - > /dev/null

        echo "----------------------------------------"
      done

      alert_lines_count=$(cat "$temp_dir/incorrect_alert" | wc -l)

      if [ $alert_lines_count != 0 ]; then
        echo "We have non-actual pseudo-tags or modules names in repository's go.mod files"
        exit 1
      fi

# ---------------------------------------------------------------------------
# Generated CRDs check
# ---------------------------------------------------------------------------
# crds/ is generated from the module's Go API types: controller-gen renders the
# OpenAPI schema from the kubebuilder markers and crd-enricher folds in what
# controller-gen cannot emit (the x-doc-* documentation fields, description
# overrides for vendored subtrees such as metav1.Condition, and the CRD-level
# normalisations the documentation renderer expects). Nothing else keeps the
# manifests and the Go types in step, so a hand edit that slips through the
# review reintroduces exactly the drift the generation was added to remove.
#
# A module opts in by shipping `hack/generate_crds.sh`. Where that script does
# not exist the job says so and passes, so this template is safe to include in
# every project regardless of whether its CRDs are generated yet.
#
# Unlike the jobs above this one carries no `allow_failure`: a stale crds/ ships
# an API the controller does not implement, which is a wrong artifact rather
# than a warning. A consuming project can still relax it on its own job.
.crds_generated_check:
  stage: go_checks
  script:
    - |
      if [ ! -f hack/generate_crds.sh ]; then
        echo "No hack/generate_crds.sh in this repository: crds/ is not generated here, nothing to check."
        exit 0
      fi

      bash hack/generate_crds.sh

      if [ -n "$(git status --porcelain -- crds/)" ]; then
        echo -e "\e[31mcrds/ is out of date with the API types\e[0m"
        echo "Run hack/generate_crds.sh and commit the result."
        git --no-pager diff -- crds/
        exit 1
      fi
      echo -e "\e[32mcrds/ matches the API types\e[0m"
