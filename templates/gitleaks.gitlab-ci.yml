variables:
  GITLEAKS_VERSION: "v8.28.0"
  GITLEAKS_BASE_CONFIG_URL: "https://raw.githubusercontent.com/deckhouse/modules-gitlab-ci/refs/heads/main/gitleaks/config/gitleaks.base.toml"

.gitleaks_scan:
  stage: gitleaks
  variables:
    GIT_DEPTH: 0
  before_script: []
  script:
    - |
      set -euo pipefail
      
      # ========== Install Gitleaks ==========
      echo "📥 Installing Gitleaks $GITLEAKS_VERSION..."
      file_ver="${GITLEAKS_VERSION#v}"
      arch="$(uname -m)"
      case "$arch" in
        x86_64|amd64)  pkg_arch="linux_x64" ;;
        aarch64|arm64) pkg_arch="linux_arm64" ;;
        *) echo "Unsupported arch: $arch"; exit 1 ;;
      esac
      
      base="https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}"
      tgz="gitleaks_${file_ver}_${pkg_arch}.tar.gz"
      curl -sSL "$base/$tgz" -o gitleaks.tgz
      tar -xzf gitleaks.tgz gitleaks
      chmod +x gitleaks
      mkdir -p "$HOME/.local/bin"
      mv gitleaks "$HOME/.local/bin/"
      export PATH="$HOME/.local/bin:$PATH"
      gitleaks version
      
      # ========== Setup centralized config ==========
      # Download centralized config to temporary directory (safe for Werf/giterminism)
      TMP_BASE_CONFIG="/tmp/gitleaks.base.toml"
      CONFIG_URL="${GITLEAKS_BASE_CONFIG_URL}"
      
      echo "📥 Downloading centralized config..."
      if curl -sSLf "$CONFIG_URL" -o "$TMP_BASE_CONFIG"; then
        echo "✅ Centralized config downloaded to $TMP_BASE_CONFIG"
      else
        echo "❌ Failed to download centralized config from $CONFIG_URL"
        echo "   Cannot proceed without centralized config to avoid false positives."
        exit 1
      fi
      
      # ========== Compose the scan config ==========
      # A module's .gitleaks.toml must extend the centralized config, not replace it.
      # Gitleaks chains configs through [extend] path, so drop the module's own [extend]
      # section, point a fresh one at the config downloaded above, and keep the rest of the
      # module config verbatim. Resulting chain:
      #   gitleaks defaults <- centralized base config <- module config
      # The module config stays standalone-valid, so `gitleaks detect` still works locally.
      MERGED_CONFIG="/tmp/gitleaks.merged.toml"
      if [[ -f ".gitleaks.toml" ]]; then
        MODULE_EXTEND_PATH="$(awk '
          /^[[:space:]]*\[extend\]/ { in_extend = 1; next }
          /^[[:space:]]*\[/         { in_extend = 0 }
          in_extend && /^[[:space:]]*path[[:space:]]*=/ { print }
        ' .gitleaks.toml)"
        if [[ -n "$MODULE_EXTEND_PATH" ]]; then
          echo "⚠️  WARNING: .gitleaks.toml declares its own [extend] path:"
          echo "     $MODULE_EXTEND_PATH"
          echo "   It is replaced by the centralized config."
        fi

        {
          printf '[extend]\nuseDefault = false\npath = "%s"\n\n' "$TMP_BASE_CONFIG"
          awk '
            /^[[:space:]]*\[extend\]/ { skip = 1; next }
            /^[[:space:]]*\[/         { skip = 0 }
            !skip
          ' .gitleaks.toml
        } > "$MERGED_CONFIG"

        CONFIG_ARG="-c $MERGED_CONFIG"
        echo "✅ Composed centralized config + module .gitleaks.toml into $MERGED_CONFIG"
      else
        # No module config - use centralized config only
        CONFIG_ARG="-c $TMP_BASE_CONFIG"
        echo "🔹 Using centralized config only (no module .gitleaks.toml)"
      fi
      
      # ========== Run scan ==========
      GITLEAKS_EXIT=0
      if [[ "$SCAN_MODE" == "diff" ]]; then
        echo "🕵️ Running in DIFF mode..."
        
        BASE_COMMIT=$(git merge-base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" "$CI_COMMIT_SHA")
        HEAD_COMMIT="$CI_COMMIT_SHA"
        
        echo "▶ Target branch: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        echo "▶ Base commit (merge-base): $BASE_COMMIT"
        echo "▶ Head commit: $HEAD_COMMIT"
        echo "▶ Scanning range: ${BASE_COMMIT}..${HEAD_COMMIT}"
        
        gitleaks detect --no-banner --report-format json --report-path gitleaks.json $CONFIG_ARG --source . --log-opts "${BASE_COMMIT}..${HEAD_COMMIT}" --log-level debug || GITLEAKS_EXIT=$?
      elif [[ "$SCAN_MODE" == "full" ]]; then
        echo "🕵️ Running in FULL mode..."
        gitleaks detect --no-banner --report-format json --report-path gitleaks.json $CONFIG_ARG --source . --log-level debug || GITLEAKS_EXIT=$?
      else
        echo "❌ Unknown SCAN_MODE: $SCAN_MODE"
        exit 1
      fi
      
      echo "🔍 Gitleaks exit code: $GITLEAKS_EXIT"
      
      # ========== Parse and print results ==========
      echo "📤 Parsing gitleaks.json for CI log output..."
      echo "DEBUG: Checking gitleaks.json file..."
      ls -lh gitleaks.json || echo "⚠️ gitleaks.json not found!"
      
      if [[ -s gitleaks.json ]]; then
        COUNT=$(jq length gitleaks.json)
        echo "❌ Leaks found: $COUNT"
        echo ""
        echo "DEBUG: Attempting to parse and display leaks..."
        
        jq -r '
          def norm:
            {
              file: (.File // .file // .Target // .Location.File // "unknown"),
              line: (.StartLine // .Line // .Location.StartLine // 0),
              rule: (.RuleID // .Rule // .Description // "unknown"),
              commit: (.Commit // .commit // "")
            };
          (if type=="object" and has("findings") then .findings
           elif type=="array" then .
           else [] end)[] | norm
          | "• [\(.rule)] \(.file):\(.line) \(.commit[0:7] // "no-commit") '$CI_PROJECT_URL'/blob/\(.commit)/\(.file)#L\(.line)"
        ' gitleaks.json | head -n 200
        
        echo ""
        echo "DEBUG: Finished displaying leaks"
        
        # Fail the job if leaks were found
        if [[ "$COUNT" -gt 0 ]]; then
          echo ""
          echo "❌ Pipeline failed due to $COUNT leak(s). Review gitleaks.json artifact."
          exit 1
        fi
      else
        echo "✅ No leaks found."
      fi

  after_script:
    - echo "🧹 Cleaning up runner workspace..."
    - rm -f "$HOME/.local/bin/gitleaks" gitleaks.tgz /tmp/gitleaks.base.toml /tmp/gitleaks.merged.toml || true

  artifacts:
    when: always
    paths:
      - gitleaks.json

  allow_failure: false

gitleaks_diff:
  extends: .gitleaks_scan
  variables:
    SCAN_MODE: "diff"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

gitleaks_full_manual:
  extends: .gitleaks_scan
  variables:
    SCAN_MODE: "full"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

gitleaks_full_scheduled:
  extends: .gitleaks_scan
  variables:
    SCAN_MODE: "full"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

