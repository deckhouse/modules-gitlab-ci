# variables:
#   $MODULES_MODULE_SOURCE - base URL for the registry, e.g., registry.example.com/deckhouse/modules
#   $MODULES_MODULE_NAME (Optional) - module name, by default it is equal to the project name
#   $WERF_REPO - registry path, default ${MODULES_MODULE_SOURCE}/${MODULES_MODULE_NAME}
#   SVACE_ANALYZE_HOST - hostname of the svace analyze vm
#   SVACE_ANALYZE_SSH_USER: - ssh user to connect with to svace analyze vm
#   SVACE_ANALYZE_SSH_PRIVATE_KEY_B64- svace analyze server ssh private key

variables:
  WERF_REPO:
    description: "Container registry storage address"
    value: ${MODULES_MODULE_SOURCE}/${MODULES_MODULE_NAME}
  SVACE_ENABLED:
    description: "Enable Svace analysis"
    value: "false"
    options:
      - "true"
      - "false"

# `.lint_base` holds the body only (no `rules:`) so consuming projects can add
# their own gating via a context mixin, e.g. `extends: [.lint_base, .dev]`, the
# same convention as `.go_linter` / `.cve_scan`. `.lint` keeps the previous
# behavior (fires on any branch/tag) for existing consumers.
.lint_base:
  stage: build
  script:
    - |
      dmt lint ./
  allow_failure: true

.lint:
  extends: .lint_base
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# `.build_base` holds the body only (no `rules:`); see `.lint_base` above.
# `.build` re-adds the default any-branch/tag gating for existing consumers.
.build_base:
  stage: build
  script:
    # Use gitlab ci job token
    - |
      SOURCE_REPO=${SOURCE_REPO#git@}
      SOURCE_REPO=${SOURCE_REPO//://}
      export SOURCE_REPO=https://gitlab-ci-token:${CI_JOB_TOKEN}@${SOURCE_REPO}

    # Build images
    - |
      werf build \
        --save-build-report --build-report-path images_tags_werf.json

    # Bundle image
    - |
      IMAGE_REPO="$(jq -r '.Images.bundle.DockerRepo' images_tags_werf.json)"
      IMAGE_SRC="$(jq -r '.Images.bundle.DockerImageName' images_tags_werf.json)"
      IMAGE_DST="${IMAGE_REPO}:${MODULES_MODULE_TAG}"

      echo "✨ Bundle image : Pushing ${IMAGE_SRC} to ${IMAGE_DST}"
      crane copy ${IMAGE_SRC} ${IMAGE_DST}

      # Copying attestation for bundle
      IMAGE_DIGEST="$(jq -r ".Images.bundle.DockerImageDigest" images_tags_werf.json)"
      IMAGE_DIGEST="${IMAGE_DIGEST#sha256:}"
      if (crane manifest "${IMAGE_REPO}:sha256-${IMAGE_DIGEST}.att" > /dev/null 2>&1); then
        echo "✨ [$(date -u)] Copying 'bundle' attestation"
        crane copy "${IMAGE_REPO}:sha256-${IMAGE_DIGEST}.att" "${IMAGE_REPO}:sha256-${IMAGE_DIGEST}.att"
      else
        echo "✨ [$(date -u)] Attestation for 'bundle' not found, skipping..."
      fi
    # Release-channel image
    - |
      IMAGE_SRC="$(jq -r '.Images."release-channel-version".DockerImageName' images_tags_werf.json)"
      IMAGE_DST="$(jq -r '.Images."release-channel-version".DockerRepo' images_tags_werf.json)/release:${MODULES_MODULE_TAG}"

      echo "✨ Pushing ${IMAGE_SRC} to ${IMAGE_DST}"
      crane copy ${IMAGE_SRC} ${IMAGE_DST}
    # Register module
    - |
      echo "✨ Register the module ${MODULES_MODULE_NAME}"
      crane append \
        --oci-empty-base \
        --new_layer "" \
        --new_tag "${MODULES_MODULE_SOURCE}:${MODULES_MODULE_NAME}"

.build:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# Publishing policy for a release tag.
#
# The prod build of a module used to be `when: manual` on every tag, so cutting a release
# meant pressing play once per edition -- and nothing tied those presses to the release
# gates: a red pipeline still left the buttons available. A module that references these
# rules instead publishes by itself as soon as a release tag exists, and only then:
#
#   - `vX.Y.Z` (exactly three numeric components) builds automatically. This is the shape
#     `Merge_Release` creates, so it is a release and nothing else;
#   - any other tag -- a release candidate, a hand-made or an experimental one -- keeps the
#     previous manual behaviour, so an ad-hoc tag never writes to the prod registry on its
#     own.
#
# `when` is set inside each rule on purpose: a consuming job usually inherits a job-level
# `when: manual` from its own prod mixin, and a rule-level `when` is what overrides it.
#
# The rules only decide *when* the build starts. What makes the release gates binding is
# the `needs` on the consuming side:
#
#   build_prod:
#     extends: [.build, .prod]
#     rules: !reference [.prod_build_rules, rules]
#     needs: ["Validate release notes"]
#
# With that `needs`, invalid release notes stop the publication instead of merely painting
# the pipeline red. The gate job has to exist in the tag pipeline for this to resolve --
# `.release_notes_validate` from Release_Notes.gitlab-ci.yml does, under that exact name.
# A module still on the flat changelog format should not reference these rules.
#
# Deploy jobs are deliberately left alone: moving a release channel stays a separate,
# manual decision, and it is a `crane copy` of an already published bundle anyway.
.prod_build_rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_BRANCH != "main"
      when: on_success
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH != "main"
      when: manual

.svace_rules_mr:
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /(^|,)analyze\/svace(,|$)/'
      variables:
        SVACE_ENABLED: "true"
.svace_rules_manual:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $SVACE_ENABLED == "true" && $CI_COMMIT_BRANCH
      variables:
        SVACE_ENABLED: "true"
.svace_rules_schedule:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SVACE_ENABLED == "true" && $CI_COMMIT_BRANCH
      variables:
        SVACE_ENABLED: "true"