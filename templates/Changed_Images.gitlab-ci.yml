# Compute changed module images (only_images.json) from werf build report.
#
# Hidden base job — concrete jobs extend it and add needs + rules + secrets.
# Produces artifacts: only_images.json + changed.env (CHANGED_COUNT).
#
# Requirements:
#   - Registry image must contain images_digests.json (path configurable)
#   - Build job must produce images_tags_werf.json artifact
#   - Registry access (regctl, logged in before this job runs)
#
# Variables (set by concrete job in before_script — these come from Vault secrets
# and are not available at YAML parse time):
#   CHANGED_IMAGES_BASE_IMAGE     — full registry path to base image, e.g.
#                                    ${DEV_REGISTRY}/sys/deckhouse-oss/modules/${MODULES_MODULE_NAME}
#   CHANGED_IMAGES_SOURCE_TAG     — tag of the base image to pull digests from (default: target branch)
#   CHANGED_IMAGES_DIGESTS_PATH   — path inside image to images_digests.json, e.g.
#                                    /images_digests.json (external) or /deckhouse/modules/images_digests.json (deckhouse)
#   MODULES_GITLAB_CI_REF         — tag/branch for script download (default: v21.0)
#
# Usage (external module):
#   include:
#     - remote: '.../Changed_Images.gitlab-ci.yml'
#   changed_images:
#     extends: .changed_images_base
#     needs: ["Build"]
#     before_script:
#       # Vault secrets resolved at runtime — set in before_script, not variables:
#       - export CHANGED_IMAGES_BASE_IMAGE="${DEV_REGISTRY}/sys/deckhouse-oss/modules/${MODULES_MODULE_NAME}"
#       - export CHANGED_IMAGES_DIGESTS_PATH="/images_digests.json"
#       - export MODULES_GITLAB_CI_REF="main"
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#
# Usage (deckhouse main repo):
#   include:
#     - project: "deckhouse/3p/deckhouse/modules-gitlab-ci"
#       ref: "main"
#       file: "/templates/Changed_Images.gitlab-ci.yml"
#   changed_images:mr:
#     extends: .changed_images_base
#     needs: [build_fe:mr]
#     before_script:
#       - export CHANGED_IMAGES_BASE_IMAGE="${DECKHOUSE_DEV_REGISTRY_HOST}/sys/deckhouse-oss"
#       - export CHANGED_IMAGES_DIGESTS_PATH="/deckhouse/modules/images_digests.json"
#       - export MODULES_GITLAB_CI_REF="main"

.changed_images_base:
  stage: cve_scan
  allow_failure: true
  variables:
    MODULES_GITLAB_CI_REF: "v21.0"
    CHANGED_IMAGES_SOURCE_TAG: ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}
    CHANGED_IMAGES_BASE_IMAGE: ""
    CHANGED_IMAGES_DIGESTS_PATH: ""
    BUILD_REPORT_PATH: "./images_tags_werf.json"
    OUTPUT_CHANGED: "./changed_images.json"
  before_script:
    # Download changed_images.py from this repo via GitLab API
    - |
      curl -sSf --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/deckhouse%2F3p%2Fdeckhouse%2Fmodules-gitlab-ci/repository/files/scripts%2Fchanged_images.py/raw?ref=${MODULES_GITLAB_CI_REF}" \
        -o changed_images.py
    # Pull images_digests.json from the base image at source tag
    - |
      echo "Pulling images_digests.json from ${CHANGED_IMAGES_BASE_IMAGE}:${CHANGED_IMAGES_SOURCE_TAG}"
      regctl image get-file "${CHANGED_IMAGES_BASE_IMAGE}:${CHANGED_IMAGES_SOURCE_TAG}" \
        "${CHANGED_IMAGES_DIGESTS_PATH}" > images_digests.json
    # Bridge: script reads GITHUB_BASE_REF to determine PR commits
    - |
      if [[ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]]; then
        export GITHUB_BASE_REF="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
      fi
  script:
    - |
      python3 changed_images.py
      CHANGED_COUNT=$(jq 'length' changed_images.json)
      jq -c '[.[].compact_keys[]?] | unique' changed_images.json > only_images.json
      echo "CHANGED_COUNT=${CHANGED_COUNT}" > changed.env
      echo "Changed final images: ${CHANGED_COUNT}"
      echo "Changed compact keys: $(cat only_images.json)"
    - rm -f changed_images.py images_digests.json changed_images.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - only_images.json
    reports:
      dotenv: changed.env

# No concrete job here — consuming projects extend .changed_images_base
# and add their own rules + needs. See usage docs above.