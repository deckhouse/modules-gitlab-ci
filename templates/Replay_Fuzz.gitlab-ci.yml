# Child-pipeline jobs for Build_Fuzz.gitlab-ci.yml.
# The parent forwards registry variables and FUZZ_PARENT_PIPELINE_ID;
# build_fuzz supplies the report, and the generated matrix selects FUZZ_IMAGE.
.replay_fuzz:
  stage: fuzz
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  needs:
    - pipeline: $FUZZ_PARENT_PIPELINE_ID
      job: build_fuzz
  before_script:
    - |
      set -euo pipefail
      export DOCKER_CONFIG=$(mktemp -d)
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      printf '%s' "$MODULES_REGISTRY_PASSWORD" |
        docker login --username "$MODULES_REGISTRY_LOGIN" --password-stdin "$MODULES_REGISTRY"
  variables:
    VAULT_SERVER_URL: https://seguro.flant.com
    VAULT_AUTH_PATH: fox
    VAULT_AUTH_ROLE: "dh-${CI_PROJECT_NAME}"
    FUZZ_S3_REPOSITORY: ${CI_PROJECT_NAME}
    FUZZ_S3_BRANCH_SLUG: main
    FUZZ_PUBLISH_REPORT: "false"
    FUZZ_RUNNER_TAG: deckhouse
    FUZZ_REPLAY_INPUT_TIMEOUT: "30s"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: gitlab-access-aud
  secrets:
    FUZZ_S3_ENDPOINT:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/team-ssdlc/fuzzing-s3/FUZZ_S3_ENDPOINT@projects
      token: $VAULT_ID_TOKEN
      file: false
    FUZZ_S3_ACCESS_KEY:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/team-ssdlc/fuzzing-s3/FUZZ_S3_ACCESS_KEY@projects
      token: $VAULT_ID_TOKEN
      file: false
    FUZZ_S3_SECRET_KEY:
      vault: 6db2f1ee-9b6f-4f4f-8381-2fb43060478a/team-ssdlc/fuzzing-s3/FUZZ_S3_SECRET_KEY@projects
      token: $VAULT_ID_TOKEN
      file: false
  script:
    - |
      set -euo pipefail
      container="fuzz-replay-${CI_JOB_ID}"
      trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM
      image=$(jq -er --arg image "$FUZZ_IMAGE" '.Images[$image].DockerImageName' images_fuzz_tags_werf.json)
      component=$(jq -r --arg image "$FUZZ_IMAGE" '
        .Images[$image] | (.GitHubPath // .GithubPath // .GitPath // .Context // .Path // "") |
        if . == "" then $image else . end' images_fuzz_tags_werf.json)
      echo "Replay $FUZZ_IMAGE"
      # Keep the stopped container until failure reports have been copied out.
      status=0
      docker run --init -i --name "$container" --platform linux/amd64 \
        -e AWS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
        -e FUZZ_S3_ENDPOINT -e FUZZ_S3_ACCESS_KEY -e FUZZ_S3_SECRET_KEY \
        -e FUZZ_S3_REPOSITORY -e FUZZ_S3_BRANCH_SLUG \
        -e FUZZ_REPLAY_INPUT_TIMEOUT \
        -e FUZZ_S3_COMPONENT="$component" \
        -e FUZZ_REPLAY_IMAGE="$image" -e CI_COMMIT_SHA -e CI_JOB_URL \
        --entrypoint bash "$image" -euo pipefail -s <<'REPLAY' || status=$?
      report=/tmp/fuzz-replay
      mkdir -p "$report"
      summary="$report/summary.txt"
      printf '=== FUZZ REPLAY SUMMARY ===\nImage: %s\nCommit: %s\nWorkdir: %s\n' \
        "$FUZZ_REPLAY_IMAGE" "$CI_COMMIT_SHA" "$PWD" > "$summary"
      case "${FUZZ_ENGINE:-go}" in
      ruzzy)
        ruby --version >> "$summary"
        printf 'Artifacts: %s/artifacts/browse/fuzz-replay/\n' "$CI_JOB_URL" >> "$summary"
        unset AWS_SESSION_TOKEN AWS_SECURITY_TOKEN AWS_PROFILE
        export AWS_ACCESS_KEY_ID="$FUZZ_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$FUZZ_S3_SECRET_KEY"
        export AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true
        aws configure set default.s3.preferred_transfer_client classic
        aws configure set default.s3.max_concurrent_requests 2
        component=${FUZZ_S3_COMPONENT#./}
        component=${component#/}
        component=${component%/}
        component=${component%-fuzz}
        component=${component%/fuzz}
        source="s3://anomaloys-materials/${FUZZ_S3_REPOSITORY}/${FUZZ_S3_BRANCH_SLUG}/${component}/"
        corpus=$(mktemp -d)
        echo "Downloading S3 corpus: $source (Ruzzy)"
        while true; do
          if aws --endpoint-url "$FUZZ_S3_ENDPOINT" s3 sync \
            "$source" "$corpus/" --exclude '*' \
            --include '*/corpus/minimized/*' --include '*/corpus/recovery/*' \
            --exclude '*/attempts/*' --exclude '*/report/*' \
            --only-show-errors 2> "$report/s3.log"; then
            break
          else
            status=$?
          fi
          cat "$report/s3.log" >&2
          grep -qE '\(429\)|Too Many Requests' "$report/s3.log" || exit "$status"
          echo 'S3 rate limit (429), retrying corpus download in 30 seconds' >&2
          sleep 30
        done
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY FUZZ_S3_ACCESS_KEY FUZZ_S3_SECRET_KEY
        echo "Downloaded corpus files: $(find "$corpus" -type f | wc -l)"
        if ! task fuzz:list </dev/null > "$report/targets.jsonl" 2> "$report/discovery.log"; then
          cat "$report/discovery.log" >&2
          echo 'Ruzzy target discovery failed' | tee -a "$summary" >&2
          exit 1
        fi
        # Unlike Go's native listing, Ruzzy exposes package/target JSON objects.
        # Target names must be unique because they form the platform's S3 keys.
        if ! jq -ser '
          if length == 0 then error("No Ruzzy fuzz targets found")
          elif any(.[]; (.package | type) != "string" or (.target | type) != "string")
            then error("fuzz:list must emit package/target JSON objects")
          elif any(.[]; (.package | test("\\A[^\\x00\\t\\r\\n]+\\z") | not) or
                        (.target | test("\\A[A-Za-z0-9_]+\\z") | not))
            then error("Invalid Ruzzy package or target name")
          elif (map(.target) | unique | length) != length
            then error("Duplicate Ruzzy target names have ambiguous S3 keys")
          else sort_by(.package, .target)[] | [.package, .target] | join("\t") end
        ' "$report/targets.jsonl" > "$report/targets.tsv" 2>> "$report/discovery.log"; then
          cat "$report/discovery.log" | tee -a "$summary" >&2
          exit 1
        fi
        failed=0
        number=0
        while IFS=$'\t' read -r package target; do
          number=$((number + 1))
          report_name="$number-$target"
          output="$report/$report_name"
          target_corpus="$corpus/$target/corpus"
          mkdir -p "$output/artifacts" "$target_corpus"
          echo "Replay Ruzzy target: package=$package target=$target"
          # The image's task owns local seeds, application services and Ruzzy.
          if FUZZ_PKG="$package" FUZZ_TARGET="$target" \
            FUZZ_CORPUS_DIR="$target_corpus" FUZZ_ARTIFACT_DIR="$output/artifacts" \
            task fuzz:replay </dev/null 2>&1 | tee "$output/replay.log"; then
            rm -rf "$output"
            continue
          else
            replay_status=$?
          fi
          failed=$((failed + 1))
          mkdir -p "$output/corpus"
          cp -R "$target_corpus/." "$output/corpus/"
          {
            printf '\nFAILED: %s / %s (exit %s)\nS3: %s%s/corpus/\nLog: fuzz-replay/%s/replay.log\n' \
              "$package" "$target" "$replay_status" "$source" "$target" "$report_name"
            cat "$output/replay.log"
            echo 'Reproduce after downloading and unpacking this job artifacts; run from their root directory:'
            printf 'docker run --rm --platform linux/amd64 \\\n  -v "$PWD"/%q:/tmp/fuzz-replay-corpus:ro --workdir %q \\\n' \
              "fuzz-replay/$report_name/corpus" "$PWD"
            printf '  -e FUZZ_PKG=%q -e FUZZ_TARGET=%q -e FUZZ_CORPUS_DIR=/tmp/fuzz-replay-corpus \\\n' \
              "$package" "$target"
            printf '  --entrypoint task %q fuzz:replay\n' "$FUZZ_REPLAY_IMAGE"
          } >> "$summary"
        done < "$report/targets.tsv"
        printf '\nTargets checked: %s; failed: %s\n' "$number" "$failed" >> "$summary"
        [[ "$failed" -eq 0 ]]
        exit
        ;;
      go) ;;
      *) echo "Unsupported fuzz engine: $FUZZ_ENGINE" >&2; exit 1 ;;
      esac
      go version >> "$summary"
      printf 'Timeout per input: %s\n' "$FUZZ_REPLAY_INPUT_TIMEOUT" >> "$summary"
      printf 'Artifacts: %s/artifacts/browse/fuzz-replay/\n' "$CI_JOB_URL" >> "$summary"
      export AWS_ACCESS_KEY_ID="$FUZZ_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$FUZZ_S3_SECRET_KEY"
      export AWS_DEFAULT_REGION=us-east-1 AWS_EC2_METADATA_DISABLED=true
      aws configure set default.s3.preferred_transfer_client classic
      aws configure set default.s3.max_concurrent_requests 2
      module=$(GOWORK=off go list -m)
      # Match the fuzzing dispatcher: source path, or the image name without -fuzz.
      component=${FUZZ_S3_COMPONENT#./}
      component=${component#/}
      component=${component%/}
      component=${component%-fuzz}
      component=${component%/fuzz}
      source="s3://anomaloys-materials/${FUZZ_S3_REPOSITORY}/${FUZZ_S3_BRANCH_SLUG}/${component}/"
      corpus=$(mktemp -d)
      echo "Downloading S3 corpus: $source (Go module: $module)"
      while true; do
        if aws --endpoint-url "$FUZZ_S3_ENDPOINT" s3 sync \
          "$source" "$corpus/" --exclude '*' \
          --include '*/corpus/minimized/*' --include '*/corpus/recovery/*' \
          --include "*/corpus/gocache-fuzz/${module}/*" \
          --exclude '*/attempts/*' --exclude '*/report/*' \
          --only-show-errors 2> /tmp/fuzz-s3.log; then
          break
        else
          status=$?
        fi
        cat /tmp/fuzz-s3.log >&2
        grep -qE '\(429\)|Too Many Requests' /tmp/fuzz-s3.log || exit "$status"
        echo 'S3 rate limit (429), retrying corpus download in 30 seconds' >&2
        sleep 30
      done
      unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY FUZZ_S3_ACCESS_KEY FUZZ_S3_SECRET_KEY
      echo "Downloaded corpus files: $(find "$corpus" -type f | wc -l)"
      echo 'Downloaded paths (first 30):'
      find "$corpus" -type f | sort | sed -n '1,30p'
      export GIT_AUTHOR_NAME=fuzz GIT_AUTHOR_EMAIL=fuzz@local
      export GIT_COMMITTER_NAME=fuzz GIT_COMMITTER_EMAIL=fuzz@local
      # As before, discover targets even if unrelated packages fail to compile.
      task fuzz:list > /tmp/fuzz-list.log 2>&1 || true
      cat /tmp/fuzz-list.log
      awk '
        /^Fuzz[[:alnum:]_]*$/ { targets[++count] = $0; next }
        /^(ok|FAIL|\?)[[:space:]]+/ {
          for (i = 1; i <= count; i++) print $2 "|" targets[i]
          delete targets; count = 0
        }
        END { if (count != 0) exit 1 }
      ' /tmp/fuzz-list.log > /tmp/fuzz-targets
      [[ -s /tmp/fuzz-targets ]] || { echo 'No Go fuzz targets found' >&2; exit 1; }
      # The dispatcher sorts packages before assigning S3 keys to duplicate names.
      LC_ALL=C sort -t '|' -k1,1 -k2,2 -u -o /tmp/fuzz-targets /tmp/fuzz-targets
      declare -A seen_targets=()
      # Supervise Go's JSON subtest events: each corpus input gets its own timer.
      # A target-wide `go test -timeout=30s` would also fail a large, healthy corpus.
      timeout_dir=$(mktemp -d)
      cat > "$timeout_dir/replay_timeout.go" <<'GO'
      package main

      import (
        "encoding/json"
        "fmt"
        "io"
        "os"
        "os/exec"
        "strings"
        "sync"
        "syscall"
        "time"
      )

      func main() {
        duration, err := time.ParseDuration(os.Args[1])
        if err != nil || duration <= 0 {
          fmt.Fprintln(os.Stderr, "FUZZ_REPLAY_INPUT_TIMEOUT must be a positive Go duration")
          os.Exit(1)
        }
        command := exec.Command(os.Args[3], os.Args[4:]...)
        command.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}
        command.Stderr = os.Stderr
        stdout, err := command.StdoutPipe()
        if err != nil {
          fmt.Fprintln(os.Stderr, err)
          os.Exit(1)
        }
        if err := command.Start(); err != nil {
          fmt.Fprintln(os.Stderr, err)
          os.Exit(1)
        }
        var mu sync.Mutex
        timers := make(map[string]*time.Timer)
        var forceKill *time.Timer
        timedOut, finished := false, false
        decoder := json.NewDecoder(stdout)
        var decodeErr error
        for {
          var raw json.RawMessage
          if decodeErr = decoder.Decode(&raw); decodeErr != nil {
            // Keep events.jsonl valid if termination interrupts a JSON record.
            io.Copy(os.Stderr, io.MultiReader(decoder.Buffered(), stdout))
            break
          }
          fmt.Fprintln(os.Stdout, string(raw))
          var event struct{ Action, Test string }
          if decodeErr = json.Unmarshal(raw, &event); decodeErr != nil {
            break
          }
          // FuzzTarget/input is a corpus entry; nested t.Run calls share its timer.
          if strings.Count(event.Test, "/") != 1 {
            continue
          }
          mu.Lock()
          switch event.Action {
          case "run":
            name := event.Test
            timers[name] = time.AfterFunc(duration, func() {
              mu.Lock()
              defer mu.Unlock()
              if timers[name] == nil || finished || timedOut {
                return
              }
              timedOut = true
              if err := os.WriteFile(os.Args[2], []byte(name+"\n"), 0644); err != nil {
                fmt.Fprintln(os.Stderr, err)
              }
              fmt.Fprintf(os.Stderr, "TIMEOUT: %s exceeded %s\n", name, duration)
              // Include the test binary and any subprocesses; SIGQUIT retains stacks.
              syscall.Kill(-command.Process.Pid, syscall.SIGQUIT)
              forceKill = time.AfterFunc(5*time.Second, func() {
                syscall.Kill(-command.Process.Pid, syscall.SIGKILL)
              })
            })
          case "pass", "fail", "skip":
            if timer := timers[event.Test]; timer != nil {
              timer.Stop()
              delete(timers, event.Test)
            }
          }
          mu.Unlock()
        }
        err = command.Wait()
        mu.Lock()
        finished = true
        for _, timer := range timers {
          timer.Stop()
        }
        if forceKill != nil {
          forceKill.Stop()
        }
        if timedOut {
          syscall.Kill(-command.Process.Pid, syscall.SIGKILL)
        }
        mu.Unlock()
        if err != nil || timedOut || decodeErr != io.EOF {
          if decodeErr != io.EOF {
            fmt.Fprintln(os.Stderr, "Invalid Go test JSON:", decodeErr)
          }
          os.Exit(1)
        }
      }
      GO
      go build -o "$timeout_dir/replay-timeout" "$timeout_dir/replay_timeout.go"
      failed=0
      number=0
      while IFS='|' read -r package target; do
        s3_key=$target
        if [[ -n "${seen_targets[$target]:-}" ]]; then s3_key="$package/$target"; fi
        seen_targets[$target]=1
        destination="$(go list -f '{{.Dir}}' "$package")/testdata/fuzz/$target"
        copied=0
        for seeds in "$corpus/$s3_key/corpus/minimized" "$corpus/$s3_key/corpus/recovery" \
          "$corpus/$s3_key/corpus/gocache-fuzz/$package/$target"; do
          [[ -d "$seeds" ]] || continue
          while IFS= read -r -d '' seed; do
            [[ -e "$destination/${seed##*/}" ]] && continue
            mkdir -p "$destination"
            cp -- "$seed" "$destination/"
            copied=$((copied + 1))
          done < <(find "$seeds" -type f -print0)
        done
        echo "Copied $copied S3 corpus files into $destination"
        number=$((number + 1))
        report_name="$number-$target"
        output="$report/$report_name"
        mkdir -p "$output"
        # JSON keeps diagnostics associated with tests; render normal Go output live.
        if "$timeout_dir/replay-timeout" "$FUZZ_REPLAY_INPUT_TIMEOUT" "$output/timed-out-tests.txt" \
          go test "$package" -run "^${target}$" -count=1 -timeout=0 -json 2> "$output/stderr.log" |
          tee "$output/events.jsonl" | jq --unbuffered -rj '.Output // empty'; then
          rm -rf "$output"
          continue
        else
          replay_status=$?
        fi
        failed=$((failed + 1))
        cat "$output/stderr.log"
        mkdir -p "$output/corpus"
        if [[ -d "$destination" ]]; then cp -R "$destination/." "$output/corpus/"; fi
        jq -rj '.Output // empty' "$output/events.jsonl" > "$output/replay.log"
        cat "$output/stderr.log" >> "$output/replay.log"
        jq -rs --arg target "$target" '
          [.[] | select(.Action == "fail" and .Test != null) | .Test | select(. != $target)] |
          unique | .[]
        ' "$output/events.jsonl" > "$output/failed-tests.txt"
        if [[ -s "$output/timed-out-tests.txt" ]]; then
          cat "$output/timed-out-tests.txt" >> "$output/failed-tests.txt"
        fi
        sort -u -o "$output/failed-tests.txt" "$output/failed-tests.txt"
        [[ -s "$output/failed-tests.txt" ]] || printf '%s\n' "$target" > "$output/failed-tests.txt"
        {
          printf '\nFAILED: %s / %s (exit %s)\nS3: %s%s/corpus/\nLog: fuzz-replay/%s/replay.log\n' \
            "$package" "$target" "$replay_status" "$source" "$s3_key" "$report_name"
          # Omit successful subtests and progress lines, retaining errors and stacks.
          sed -E '/^=== (RUN|PAUSE|CONT|NAME)/d; /^[[:space:]]*--- (PASS|SKIP):/d' "$output/replay.log"
          echo 'Reproduce after downloading and unpacking this job artifacts; run from their root directory:'
          while IFS= read -r test; do
            run=$(printf '%s' "$test" | sed 's/[][(){}.^$*+?|\\]/\\&/g; s|/|$/^|g; s/^/^/; s/$/$/')
            printf '\nTest: %s\n' "$test"
            printf 'docker run --rm --platform linux/amd64 \\\n  -v "$PWD"/%q:%q:ro --workdir %q \\\n' \
              "fuzz-replay/$report_name/corpus" "$destination" "$PWD"
            printf '  -e GIT_AUTHOR_NAME=fuzz -e GIT_AUTHOR_EMAIL=fuzz@local -e GIT_COMMITTER_NAME=fuzz -e GIT_COMMITTER_EMAIL=fuzz@local \\\n'
            printf '  --entrypoint go %q test %q -run %q -count=1 -timeout %q -v\n' \
              "$FUZZ_REPLAY_IMAGE" "$package" "$run" "$FUZZ_REPLAY_INPUT_TIMEOUT"
          done < "$output/failed-tests.txt"
        } >> "$summary"
      done < /tmp/fuzz-targets
      printf '\nTargets checked: %s; failed: %s\n' "$number" "$failed" >> "$summary"
      [[ "$failed" -eq 0 ]]
      REPLAY
      mkdir -p fuzz-replay
      if docker cp "$container:/tmp/fuzz-replay/." fuzz-replay/; then
        cat fuzz-replay/summary.txt
      else
        echo 'Could not collect replay artifacts' >&2
        status=1
      fi
      exit "$status"
  artifacts:
    when: always
    paths:
      - fuzz-replay/
    expire_in: 7 days
  tags:
    - $FUZZ_RUNNER_TAG

.publish_fuzz_report:
  extends: .replay_fuzz
  artifacts: null
  stage: fuzz-report
  rules:
    - if: $FUZZ_PUBLISH_REPORT == "true"
  needs:
    - pipeline: $FUZZ_PARENT_PIPELINE_ID
      job: build_fuzz
    - job: replay_fuzz
      artifacts: false
  script:
    - |
      set -euo pipefail
      container="fuzz-report-${CI_JOB_ID}"
      trap 'docker rm -f "$container" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM
      image=$(jq -er '.Images | to_entries[0].value.DockerImageName' images_fuzz_tags_werf.json)
      docker run --rm --init --name "$container" --platform linux/amd64 \
        -e AWS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
        -e FUZZ_S3_ENDPOINT -e FUZZ_S3_ACCESS_KEY -e FUZZ_S3_SECRET_KEY \
        -e FUZZ_S3_REPOSITORY -e CI_COMMIT_REF_SLUG \
        --mount "type=bind,src=$CI_PROJECT_DIR/images_fuzz_tags_werf.json,dst=/report.json,readonly" \
        --entrypoint bash "$image" -euc '
          export AWS_ACCESS_KEY_ID="$FUZZ_S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$FUZZ_S3_SECRET_KEY"
          export AWS_DEFAULT_REGION=us-east-1
          aws --endpoint-url "$FUZZ_S3_ENDPOINT" s3 cp /report.json \
            "s3://anomaloys-materials/build-reports/${FUZZ_S3_REPOSITORY}/${CI_COMMIT_REF_SLUG}/images_fuzz_tags_werf.json" \
            --only-show-errors
        '
