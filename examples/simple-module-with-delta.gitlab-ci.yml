# Example: external module with delta CVE scan on MR.
#
# Prerequisites:
#   - Module image must contain /images_digests.json
#   - MODULES_MODULE_SOURCE, DEV_MODULES_REGISTRY* set in GitLab CI variables
#   - VAULT_ROLE set (for Vault secrets in CVE_Scan)
#   - Module must use werf Build template (produces images_tags_werf.json)
#
# Delta flow:
#   Build → changed_images (curl script + compare) → only_images.json
#   cve_scan (needs changed_images) → CS_ONLY_IMAGES_ENABLED=true → delta scan
#
# If changed_images fails (e.g. no images_digests.json), allow_failure keeps
# pipeline green, and cve_scan runs full scan as fallback.

include:
  - remote: 'https://raw.githubusercontent.com/deckhouse/modules-gitlab-ci/refs/heads/main/templates/Setup.gitlab-ci.yml'
  - remote: 'https://raw.githubusercontent.com/deckhouse/modules-gitlab-ci/refs/heads/main/templates/Build.gitlab-ci.yml'
  - remote: 'https://raw.githubusercontent.com/deckhouse/modules-gitlab-ci/refs/heads/main/templates/Deploy.gitlab-ci.yml'
  - remote: 'https://raw.githubusercontent.com/deckhouse/modules-gitlab-ci/refs/heads/main/templates/CVE_Scan.gitlab-ci.yml'
  # Note: Changed_Images is auto-included by CVE_Scan template.

variables:
  MODULES_MODULE_SOURCE: registry.example.com/deckhouse/modules
  MODULES_MODULE_NAME: my-module
  WERF_VERSION: "2 stable"
  CS_EXTERNAL_MODULE_NAME: my-module

default:
  tags:
    - my-runner-tag

stages:
  - lint
  - build
  - go_checks
  - cve_scan
  - deploy_prod_alpha
  - deploy_prod_beta
  - deploy_prod_ea
  - deploy_prod_stable
  - deploy_prod_rock_solid

Lint:
  stage: lint
  extends: .lint

Build:
  stage: build
  extends: .build

# --- Delta CVE scan on MR ---
cve_scan:
  stage: cve_scan
  extends: .cve_scan
  variables:
    CS_CASE: "External Modules"
    CS_ONLY_IMAGES_ENABLED: "true"
    VAULT_ROLE: $VAULT_ROLE
  needs: ["Build", "changed_images"]
  before_script:
    # CVE_Scan template's before_script runs first (Vault, d8, ssh, clone cve-scripts)
    # Then we add our overrides:
    - |
      if [[ "${CS_ONLY_IMAGES_ENABLED}" == "true" && -f only_images.json ]]; then
        export CS_ONLY_IMAGES=$(cat only_images.json)
        echo "Delta scan: ${CS_ONLY_IMAGES}"
      else
        echo "Full scan (no only_images.json or delta disabled)"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CS_SOURCE_TAG: "pr${CI_MERGE_REQUEST_IID}"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CS_SOURCE_TAG: ${CI_DEFAULT_BRANCH}
    - if: $CI_COMMIT_TAG
      variables:
        CS_SOURCE_TAG: ${CI_COMMIT_TAG}
      when: manual

# --- Deploy ---
Deploy to Alpha:
  stage: deploy_prod_alpha
  extends: .deploy
  variables:
    RELEASE_CHANNEL: alpha

Deploy to Beta:
  stage: deploy_prod_beta
  extends: .deploy
  variables:
    RELEASE_CHANNEL: beta

Deploy to EarlyAccess:
  stage: deploy_prod_ea
  extends: .deploy
  variables:
    RELEASE_CHANNEL: early-access

Deploy to Stable:
  stage: deploy_prod_stable
  extends: .deploy
  variables:
    RELEASE_CHANNEL: stable

Deploy to RockSolid:
  stage: deploy_prod_rock_solid
  extends: .deploy
  variables:
    RELEASE_CHANNEL: rock-solid